name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rumah123_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, pdo_mysql, bcmath
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: composer install --no-progress --prefer-dist
      - run: cp .env.testing.example .env.testing 2>/dev/null || true
      - run: php artisan migrate --env=testing --force
      - run: vendor/bin/pint --test
      - run: php artisan test --compact
      - run: npm ci --ignore-scripts
      - run: npm run build
