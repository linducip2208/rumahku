name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: rumah123_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rumah123_testing
      DB_USERNAME: root
      DB_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, pdo_mysql, bcmath
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: composer install --no-progress --prefer-dist
      - run: php artisan migrate --env=testing --force
      - run: vendor/bin/pint --test
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: vendor/bin/phpunit tests/Unit
        if: always()
      - run: vendor/bin/phpunit tests/Feature/AdminPanelTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/AgentFlowTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/AgentListingLifecycleTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/ApiDocsTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/ApiTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/AuctionBidTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/AuctionRaceTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/AuditLogTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/BackupTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/CaptchaTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/ContactTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/ExampleTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/ExtraFlowTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/FacilityTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/FavoriteToggleTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/FeatureConnectionTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/FlushDemoDataTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/HardeningTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/IdeaBankTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/InfoTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/KprFlowTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/LandingDataTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/LeadNotifyTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/LeadPipelineTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/ListingQuotaTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/LocaleTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/LoginThrottleTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/MarketplaceTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/MessageTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/ModerationTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/OrderOwnershipTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/OwnerRoleTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/PackageTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/PayFlowTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/PaymentIdempotencyTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/PaymentTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/PropertyCsvTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/SearchTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/SeoArticlesTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/SoldStatusTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/TokenSecurityTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/TrackAndBrochureTest.php
        if: always()
      - run: vendor/bin/phpunit tests/Feature/UnpublishedApiTest.php
        if: always()

  dusk:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: rumah123_dusk
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rumah123_dusk
      DB_USERNAME: root
      DB_PASSWORD: ci-password
      SCOUT_DRIVER: collection
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, pdo_mysql, bcmath, curl
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: browser-actions/setup-chrome@latest
      - run: composer install --no-progress --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: php artisan migrate --seed --force
      - run: php artisan dusk:chrome-driver --detect
      - run: php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
      - run: for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000 > /dev/null && break; sleep 1; done
      - run: vendor/bin/phpunit --log-junit /tmp/junit-dusk.xml tests/Browser
      - uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: /tmp/junit-dusk.xml
          check_name: Dusk results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dusk-artifacts
          path: |
            tests/Browser/screenshots/
            tests/Browser/console/
            storage/logs/
